name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Licences (ADR 0007's allow-list)
        run: npm run licences
      - name: Type check
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build for Chrome and Firefox
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: extension-${{ github.sha }}
          path: dist/
          retention-days: 14
